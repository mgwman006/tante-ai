spring:
  application:
    name: tante-ai
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  sql:
    init:
      mode: never
  ai:
    vectorstore:
      qdrant:
        initialize-schema: true
        host: localhost
        port: 6334
        collection-name: tante-ai-vector-store

    chat:
      client:
        enabled: false
    model:
      chat: openai
      embedding: openai
    openai:
      chat:
        model: docker.io/qwen2.5:latest
        base-url: http://localhost:12434/engines/v1
      embedding:
        model: docker.io/ai/embeddinggemma:latest
        base-url: http://localhost:12434/engines/v1
      api-key: dummy-key
  security:
    oauth2:
      client:
        provider:
          tante-auth:
            issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081/auth-manager}
        registration:
          property-manager-client:
            provider: tante-auth
            authorization-grant-type: client_credentials
            client-id: ${PROPERTY_MANAGER_CLIENT_ID:rent-manager}
            client-secret: ${PROPERTY_MANAGER_CLIENT_SECRET:secret}
            scope:
              - property.read
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081/auth-manager}
  docker:
    compose:
      stop:
        command: down
logging:
  level:
    org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor: DEBUG
server:
  port: 8086

property:
  manager:
    base:
      url: http://localhost:8082/property-manager
